version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /node
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 3
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Types must match the lowest supported Node; bump by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the native rewrite; migrate on purpose and compare .d.ts.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
