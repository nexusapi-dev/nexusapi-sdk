# Publishes python/ to PyPI as `nexusapi-sdk` when a tag python-sdk-v<VERSION>
# is pushed (for example python-sdk-v0.3.1).
#
# Uses PyPI Trusted Publishing (OIDC): no API token is stored in GitHub.
# PyPI project nexusapi-sdk → Publishing: this repository, workflow
# `publish-python.yml`, environment `pypi`. The `pypi` environment requires a
# reviewer's approval and only accepts python-sdk-v* tags. See RELEASING.md.
#
# Order: full CI → build (no publishing rights) → publish (OIDC only).
# Manual run (Actions → Run workflow) runs CI and builds, never uploads.
name: Publish Python SDK

on:
  push:
    tags:
      - "python-sdk-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify tag matches version and is on main
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/python-sdk-v}"
          PKG_VERSION=$(grep -E '^version\s*=' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "Tag: $TAG_VERSION  Package: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) != pyproject.toml version ($PKG_VERSION)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not on main"
            exit 1
          fi

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Build wheel + sdist
        run: |
          python -m pip install "build>=1.2,<2" "twine>=6,<7"
          rm -rf dist build
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          python -m build
          python -m twine check --strict dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-dist
          path: python/dist/
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/nexusapi-sdk/
    permissions:
      id-token: write # Trusted Publishing + attestations
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
