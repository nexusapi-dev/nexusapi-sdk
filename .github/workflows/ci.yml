# Tests for both SDKs on every push to main and every pull request.
# Also called by the publish workflows (workflow_call), so a release only
# goes out when the full matrix is green.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python ${{ matrix.python-version }}${{ matrix.httpx && format(' / httpx {0}', matrix.httpx) || '' }}
    # The oldest supported Python is end-of-life and may have no build for the
    # newest ubuntu-latest image, so it runs on Ubuntu 24.04.
    runs-on: ${{ matrix.python-version == '3.10' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        httpx: [""] # "" = latest
        include:
          # Extra job: oldest supported httpx from pyproject.toml.
          - python-version: "3.10"
            httpx: "0.24.*"
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Pin oldest httpx
        if: matrix.httpx
        run: python -m pip install "httpx==${{ matrix.httpx }}"
      - name: Test
        run: python -m pytest -q

  python-package:
    name: Python package build + typing
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python -m pip install "build>=1.2,<2" "twine>=6,<7" "mypy>=1.10,<2" -e .
      - name: Type check (strict), including examples
        run: python -m mypy --strict nexusapi examples
      - run: python -m build
      - run: python -m twine check --strict dist/*

  node:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24", "26"]
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm pack --dry-run
      - name: Type check examples
        if: matrix.node-version == '22'
        run: npm run examples:check
      - name: Lint package (publint, arethetypeswrong)
        if: matrix.node-version == '22'
        run: |
          npm pack --ignore-scripts
          npx --yes publint@0.3.25 ./nexusapi-sdk-*.tgz
          npx --yes @arethetypeswrong/cli@0.18.5 ./nexusapi-sdk-*.tgz

  versions:
    name: Versions in sync
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python, Node and CHANGELOG agree
        run: |
          PY=$(grep -E '^version\s*=' python/pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          PY_INIT=$(grep -E '^__version__' python/nexusapi/__init__.py | sed -E 's/.*"([^"]+)".*/\1/')
          NODE=$(node -p "require('./node/package.json').version")
          LOCK=$(node -p "require('./node/package-lock.json').version")
          TS=$(grep -E 'export const VERSION' node/src/client.ts | sed -E 's/.*"([^"]+)".*/\1/')
          echo "pyproject=$PY __init__=$PY_INIT package.json=$NODE lock=$LOCK VERSION=$TS"
          for v in "$PY_INIT" "$NODE" "$LOCK" "$TS"; do
            [ "$v" = "$PY" ] || { echo "::error::Versions differ"; exit 1; }
          done
          grep -qE "^## $PY( |$)" CHANGELOG.md || { echo "::error::CHANGELOG.md has no '## $PY' section"; exit 1; }

  # Single required status check for branch protection.
  ci-ok:
    name: CI OK
    if: always()
    needs: [python, python-package, node, versions]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do [ "$r" = "success" ] || exit 1; done
