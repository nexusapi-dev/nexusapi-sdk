# Publishes node/ to npm as `nexusapi-sdk` when a tag node-sdk-v<VERSION>
# is pushed (for example node-sdk-v0.3.0).
#
# Uses npm Trusted Publishing (OIDC): no npm token is stored in GitHub, and
# the package gets a provenance attestation ("Built and signed on GitHub
# Actions"). One-time setup on npmjs.com — package nexusapi-sdk → Settings →
# Trusted Publisher → GitHub Actions with this repository, workflow
# `publish-node.yml` and environment `npm`. See RELEASING.md.
#
# Manual run (Actions → Run workflow) only builds and checks, never publishes.
name: Publish Node SDK

on:
  push:
    tags:
      - "node-sdk-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/nexusapi-sdk
    permissions:
      contents: read
      id-token: write # Trusted Publishing + provenance
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/node-sdk-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag: $TAG_VERSION  Package: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) != package.json version ($PKG_VERSION)"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing needs npm CLI 11.5.1 or newer.
      - name: Update npm
        run: npm install -g npm@^11.5.1

      - run: npm ci
      - run: npm test

      - name: Pack (dry-run preview)
        run: npm pack --dry-run

      - name: Publish to npm
        if: github.event_name == 'push'
        run: npm publish --provenance --access public
