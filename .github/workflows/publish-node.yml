# Publishes node/ to npm as `nexusapi-sdk` when a tag node-sdk-v<VERSION>
# is pushed (for example node-sdk-v0.3.1).
#
# Uses npm Trusted Publishing (OIDC): no npm token is stored in GitHub, and
# the package gets a provenance attestation. npm package nexusapi-sdk →
# Trusted Publisher: this repository, workflow `publish-node.yml`, environment
# `npm`. The `npm` environment requires a reviewer's approval and only accepts
# node-sdk-v* tags. See RELEASING.md.
#
# Order: full CI → build + pack (no publishing rights) → publish the packed
# tarball (OIDC only, no install scripts run in that job).
# Manual run (Actions → Run workflow) runs CI and packs, never publishes.
name: Publish Node SDK

on:
  push:
    tags:
      - "node-sdk-v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify tag matches version and is on main
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/node-sdk-v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag: $TAG_VERSION  Package: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) != package.json version ($PKG_VERSION)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not on main"
            exit 1
          fi

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"

      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Pack
        run: |
          npm pack --ignore-scripts
          ls -l nexusapi-sdk-*.tgz

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: node-package
          path: node/nexusapi-sdk-*.tgz
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: npm
      url: https://www.npmjs.com/package/nexusapi-sdk
    permissions:
      id-token: write # Trusted Publishing + provenance
    steps:
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing needs npm CLI 11.5.1+; pinned exact version.
      - name: Install npm
        run: |
          npm install -g npm@11.21.3
          npm --version

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: node-package

      - name: Publish to npm
        run: npm publish ./nexusapi-sdk-*.tgz --provenance --access public

  # GitHub Release с заметками из CHANGELOG.md и файлами пакета.
  github-release:
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: node-package
          path: release-files/
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#node-sdk-v}"
          awk -v v="$VERSION" '$0 ~ "^## "v"( |$)" {f=1; next} f && /^## / {exit} f {print}' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
          # Повторный запуск job не падает: релиз уже есть — обновляем заметки и файлы.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" release-files/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Node SDK $VERSION" --notes-file notes.md release-files/*
          fi
